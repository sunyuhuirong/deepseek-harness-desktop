# The desktop bundle patch: customizes the web-app runtime for the Electron
# desktop environment. Applied after dsh-web-app's insert; rows here override
# web-app rows by id, with the profile's own cordis.patch.yml still to come.
#
# Key differences from web-app:
# - printUrl: false — the desktop app manages its own window, no need to print URL
# - surfaceContext: true — still inform the model it's in a desktop app
# - trustedHosts: only 127.0.0.1 — desktop never exposes to LAN
# - Persona is overridden to mention "desktop application" instead of "Web GUI"

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model, running inside
      the DeepSeek Harness Desktop application. Your working directory is
      {{cwd}}. The Desktop application provides native OS integrations
      (file dialogs, notifications) accessible via `window.dsh.desktop` in the
      browser. When the user refers to "this app" or "the desktop", they mean
      this Electron-based application. The client-plugin HMR receiver is active,
      but client-plugin changes reload without a refresh only while
      `pnpm run dev:web` is also running from this same checkout to rebuild their
      bundles; verify that watcher before promising automatic updates. Every
      other change — the apps/web shell and plain packages — requires rebuilding
      the affected Web artifacts and verifying the existing URL after a page
      refresh.

# TODO: Re-enable shared HMR for Desktop after its reload lifecycle is tested.
- id: hmr
  disabled: true

# Full-text session search is opt-in (the base row's `openAt: never`).
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# ── desktop-specific host rows ────────────────────────────────────────────────
# These are identical to web-app; we restate the key rows so they override cleanly.

- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js dshHomePath('storages')

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: message-feedback
  name: '@deepseek-ai/dsh-message-feedback'
  config:
    maxNoteBytes: 8192

- id: session-log-download
  name: '@deepseek-ai/dsh-session-log-export'

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

- id: session-projection-cache
  name: '@deepseek-ai/dsh-session-projection-cache'
  config:
    writeEveryEvents: 200
    writeIntervalMs: 5000

- id: session-stats
  name: '@deepseek-ai/dsh-session-stats'

- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'

- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'

- id: api-gateway
  name: '@deepseek-ai/dsh-host-apiproxy'

- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'

- id: web-startup
  name: '@deepseek-ai/dsh-web-app/startup'

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080

# Desktop runtime: resolved from the web-app glue but with printUrl=false.
- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject: [webStartup]
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts:
      - '127.0.0.1'

- id: client-hmr
  name: '@deepseek-ai/dsh-client-hmr'

# ── browser plugin roster ─────────────────────────────────────────────────────
- id: modules
  name: '@deepseek-ai/dsh-client-modules'

- id: connection
  name: '@deepseek-ai/dsh-client-connection'
